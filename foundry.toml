# Full reference https://github.com/foundry-rs/foundry/tree/master/config
# Foundry version: 1.2.0

#───────────────────────────────────────────────────────────────────────────────
# Default Profile - Used for general development and testing
#───────────────────────────────────────────────────────────────────────────────
[profile.default]
solc = "0.8.33"
auto_detect_solc = false
auto_detect_remappings = false
bytecode_hash = "ipfs"
cbor_metadata = true
sparse_mode = false
evm_version = "cancun"
fuzz = { runs = 1_000 }
gas_reports = ["*"]
libs = ["lib"]
optimizer = true
optimizer_runs = 200
out = "out"
script = "script"
src = "src"
test = "test"
ignored_warnings_from = ["node_modules", "lib", "test"]
gas_limit = "18446744073709551615"
via_ir = true

[profile.default.optimizer_details]
yul = true

#───────────────────────────────────────────────────────────────────────────────
# Deploy Profile - Production deployments
#───────────────────────────────────────────────────────────────────────────────
[profile.deploy]
solc = "0.8.33"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
evm_version = "cancun"
sparse_mode = false
auto_detect_solc = false
auto_detect_remappings = false
build_info = true
extra_output = ["storageLayout"]

[profile.deploy.optimizer_details]
yul = true
constantOptimizer = true

#───────────────────────────────────────────────────────────────────────────────
# Dev Profile - Fast iteration (no optimization)
#───────────────────────────────────────────────────────────────────────────────
[profile.dev]
solc = "0.8.33"
via_ir = false
optimizer = false
optimizer_runs = 200
sparse_mode = true
auto_detect_solc = false
auto_detect_remappings = false

#───────────────────────────────────────────────────────────────────────────────
# Dev Scripts Profile - For running scripts locally without optimization
#───────────────────────────────────────────────────────────────────────────────
[profile.dev-scripts]
solc = "0.8.33"
via_ir = false
optimizer = false
optimizer_runs = 200
sparse_mode = true
auto_detect_solc = false
auto_detect_remappings = false

#───────────────────────────────────────────────────────────────────────────────
# Test Profile - Unit and integration tests
#───────────────────────────────────────────────────────────────────────────────
[profile.test]
solc = "0.8.33"
via_ir = false
optimizer = false
optimizer_runs = 200
sparse_mode = true
fuzz = { runs = 100 }
invariant = { runs = 100 }
auto_detect_solc = false

#───────────────────────────────────────────────────────────────────────────────
# CI Profile - Continuous integration (extensive fuzzing)
#───────────────────────────────────────────────────────────────────────────────
[profile.ci]
solc = "0.8.33"
via_ir = false
optimizer = true
optimizer_runs = 200
auto_detect_solc = false
fuzz = { runs = 10_000 }
verbosity = 4
sparse_mode = true

#───────────────────────────────────────────────────────────────────────────────
# Gas Profile - Gas optimization analysis
#───────────────────────────────────────────────────────────────────────────────
[profile.gas]
solc = "0.8.33"
via_ir = true
optimizer = true
optimizer_runs = 10_000
gas_reports = ["*"]

#───────────────────────────────────────────────────────────────────────────────
# Size Profile - Contract size optimization (minimize bytecode)
#───────────────────────────────────────────────────────────────────────────────
[profile.size]
solc = "0.8.33"
via_ir = true
optimizer = true
optimizer_runs = 1

#───────────────────────────────────────────────────────────────────────────────
# Formatter Configuration
#───────────────────────────────────────────────────────────────────────────────
[fmt]
bracket_spacing = true
int_types = "long"
single_line_statement_blocks = "single"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 2
wrap_comments = true
sort_imports = true

#───────────────────────────────────────────────────────────────────────────────
# RPC Endpoints
#───────────────────────────────────────────────────────────────────────────────
[rpc_endpoints]
mainnet = "${RPC_URL_MAINNET}"
sepolia = "${RPC_URL_SEPOLIA}"
arbitrum = "${RPC_URL_ARBITRUM}"
arbitrum-sepolia = "${RPC_URL_ARBITRUM_SEPOLIA}"
base = "${RPC_URL_BASE}"
base-sepolia = "${RPC_URL_BASE_SEPOLIA}"
polygon = "${RPC_URL_POLYGON}"
polygon-amoy = "${RPC_URL_POLYGON_AMOY}"

#───────────────────────────────────────────────────────────────────────────────
# Etherscan Verification
#───────────────────────────────────────────────────────────────────────────────
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
polygon = { key = "${POLYGONSCAN_API_KEY}", chain = 137 }
polygon-amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }

#───────────────────────────────────────────────────────────────────────────────
# Fuzz Testing Defaults
#───────────────────────────────────────────────────────────────────────────────
[fuzz]
runs = 1000
